<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/src/assets/logo_new.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeevan Roshini — Community Health Management Platform | Ayathana Trust</title>
    <meta name="description" content="Jeevan Roshini is a community health management platform empowering Village Health Workers and administrators across rural India with family registry, maternal care, child wellness, and disease monitoring tools." />
    <meta name="keywords" content="community health, village health worker, maternal care, child health, rural health India, NGO health platform, preventive healthcare" />
    <meta property="og:title" content="Jeevan Roshini — Transforming Rural Communities Through Preventive Healthcare" />
    <meta property="og:description" content="A unified digital platform for family health management, maternal care, child wellness, and community development across villages." />
    <meta property="og:type" content="website" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B6E6E" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body style="background:#F4F7FA;" class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registered successfully:', reg.scope))
            .catch(err => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
