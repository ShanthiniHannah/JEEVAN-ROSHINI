name: Jeevan Roshini CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs on the same branch to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Frontend CI Jobs
  # ─────────────────────────────────────────────────────────────

  frontend-lint:
    name: "Frontend ESLint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: "⬇️ Checkout repository"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "📦 Install dependencies (npm ci)"
        run: npm ci

      - name: "🔍 ESLint — code quality check"
        run: npm run lint

  frontend-build:
    name: "Frontend Vite build"
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: "⬇️ Checkout repository"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "📦 Install dependencies (npm ci)"
        run: npm ci

      - name: "🏗️ Vite build — production bundle"
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1

  frontend-test:
    name: "Frontend Vitest (44 tests)"
    runs-on: ubuntu-latest
    needs: frontend-build
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: "⬇️ Checkout repository"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "📦 Install dependencies (npm ci)"
        run: npm ci

      - name: "🧪 Vitest — unit + integration tests"
        run: npm run test
        env:
          CI: true

  frontend-coverage:
    name: "Frontend Vitest Coverage"
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: "⬇️ Checkout repository"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "📦 Install dependencies (npm ci)"
        run: npm ci

      - name: "📊 Vitest — generate coverage report"
        run: npm run test:coverage
        env:
          CI: true

      - name: "📤 Upload coverage report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Backend CI Jobs
  # ─────────────────────────────────────────────────────────────

  backend-lint:
    name: "Backend Laravel Pint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: "⬇️ Checkout repository"
        uses: actions/checkout@v4

      - name: "⚙️ Setup PHP 8.3"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, pdo_sqlite, pdo_mysql, bcmath, zip, gd, exif, pcntl
          coverage: none
          tools: composer:v2

      - name: "📦 Install Composer dependencies"
        run: |
          composer install \
            --no-ansi \
            --no-interaction \
            --no-scripts \
            --no-progress \
            --prefer-dist

      - name: "🔍 Laravel Pint — code style check"
        run: ./vendor/bin/pint --test

  backend-test:
    name: "Backend PHPUnit (31 tests)"
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend
    steps:
      - name: "⬇️ Checkout repository"
        uses: actions/checkout@v4

      - name: "⚙️ Setup PHP 8.3"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, pdo_sqlite, pdo_mysql, bcmath, zip, gd, exif, pcntl
          coverage: none
          tools: composer:v2

      - name: "📦 Install Composer dependencies"
        run: |
          composer install \
            --no-ansi \
            --no-interaction \
            --no-scripts \
            --no-progress \
            --prefer-dist

      - name: "📋 Copy .env for testing"
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
        env:
          APP_ENV: testing

      - name: "🗄️ Create SQLite test database"
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: "🧪 PHPUnit — run full test suite"
        run: php vendor/bin/phpunit --colors=always
        env:
          APP_ENV:       testing
          DB_CONNECTION: sqlite
          DB_DATABASE:   database/database.sqlite
          APP_KEY:       ${{ secrets.APP_KEY || 'base64:dz9eSNeAc40wv/E9iyOqIs52jQnxW5hAWfAPFwJfj00=' }}
          CACHE_STORE:   array
          SESSION_DRIVER: array
