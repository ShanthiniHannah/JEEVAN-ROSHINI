name: Jeevan Roshini CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Frontend Vitest Suite
  # ─────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Vitest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: npm run test

  # ─────────────────────────────────────────────────────────────
  # Job 2: Backend PHPUnit Suite
  # ─────────────────────────────────────────────────────────────
  backend-test:
    name: Backend PHPUnit Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, pdo_mysql, bcmath, zip
          coverage: none

      - name: Install Composer Dependencies
        working-directory: backend
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Create SQLite Database for Testing
        working-directory: backend
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Run PHPUnit Tests
        working-directory: backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          APP_KEY: ${{ secrets.APP_KEY || 'base64:dz9eSNeAc40wv/E9iyOqIs52jQnxW5hAWfAPFwJfj00=' }}
        run: php vendor/bin/phpunit

  # ─────────────────────────────────────────────────────────────
  # Job 3: Docker Build Verification
  # ─────────────────────────────────────────────────────────────
  docker-test:
    name: Docker Environment Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: jeevan-roshini-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: build
          push: false
          tags: jeevan-roshini-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
