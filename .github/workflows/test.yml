name: Jeevan Roshini CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous runs on the same branch to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Frontend — Lint → Build → Unit Tests → Coverage
  # ─────────────────────────────────────────────────────────────
  frontend-ci:
    name: "Frontend CI (Lint + Build + Tests)"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: "⬇️ Checkout repository"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "📦 Install dependencies (npm ci)"
        run: npm ci

      # ── Step 1: Lint ──────────────────────────────────────────
      - name: "🔍 ESLint — code quality check"
        run: npm run lint
        # Treat lint warnings as OK but fail on errors (exit code 1)
        # The eslint.config.js is tuned so only real errors produce exit 1

      # ── Step 2: Build ─────────────────────────────────────────
      - name: "🏗️ Vite build — production bundle"
        run: npm run build
        env:
          # Use a placeholder API URL for CI builds (no real backend)
          VITE_API_BASE_URL: http://localhost:8000/api/v1

      # ── Step 3: Unit Tests (Vitest) ───────────────────────────
      - name: "🧪 Vitest — unit + integration tests"
        run: npm run test
        env:
          CI: true

      # ── Step 4: Test Coverage ─────────────────────────────────
      - name: "📊 Vitest — generate coverage report"
        run: npm run test:coverage
        env:
          CI: true

      - name: "📤 Upload coverage report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 2: Backend — Lint (Pint) → Unit Tests → Feature Tests
  # ─────────────────────────────────────────────────────────────
  backend-ci:
    name: "Backend CI (Pint + PHPUnit)"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: "⬇️ Checkout repository"
        uses: actions/checkout@v4

      - name: "⚙️ Setup PHP 8.3"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, pdo_sqlite, pdo_mysql, bcmath, zip, gd, exif, pcntl
          coverage: none
          tools: composer:v2

      - name: "📦 Install Composer dependencies"
        run: |
          composer install \
            --no-ansi \
            --no-interaction \
            --no-scripts \
            --no-progress \
            --prefer-dist

      - name: "📋 Copy .env for testing"
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
        env:
          APP_ENV: testing

      # ── Step 1: PHP Lint (Laravel Pint) ───────────────────────
      - name: "🔍 Laravel Pint — code style check"
        run: ./vendor/bin/pint --test
        # --test: exit 1 if any files need formatting, but don't write changes

      # ── Step 2: Prepare SQLite test database ──────────────────
      - name: "🗄️ Create SQLite test database"
        run: |
          mkdir -p database
          touch database/database.sqlite

      # ── Step 3: Unit Tests ────────────────────────────────────
      - name: "🧪 PHPUnit — Unit test suite"
        run: php vendor/bin/phpunit --testsuite Unit --colors=always
        env:
          APP_ENV:       testing
          DB_CONNECTION: sqlite
          DB_DATABASE:   database/database.sqlite
          APP_KEY:       ${{ secrets.APP_KEY || 'base64:dz9eSNeAc40wv/E9iyOqIs52jQnxW5hAWfAPFwJfj00=' }}
          CACHE_STORE:   array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

      # ── Step 4: Feature Tests ─────────────────────────────────
      - name: "🧪 PHPUnit — Feature test suite"
        run: php vendor/bin/phpunit --testsuite Feature --colors=always
        env:
          APP_ENV:       testing
          DB_CONNECTION: sqlite
          DB_DATABASE:   database/database.sqlite
          APP_KEY:       ${{ secrets.APP_KEY || 'base64:dz9eSNeAc40wv/E9iyOqIs52jQnxW5hAWfAPFwJfj00=' }}
          CACHE_STORE:   array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

      # ── Step 5: Full Test Suite (summary) ────────────────────
      - name: "📊 PHPUnit — full suite report"
        run: php vendor/bin/phpunit --colors=always
        env:
          APP_ENV:       testing
          DB_CONNECTION: sqlite
          DB_DATABASE:   database/database.sqlite
          APP_KEY:       ${{ secrets.APP_KEY || 'base64:dz9eSNeAc40wv/E9iyOqIs52jQnxW5hAWfAPFwJfj00=' }}
          CACHE_STORE:   array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

  # ─────────────────────────────────────────────────────────────
  # Job 3: Docker — Build Validation for both images
  # ─────────────────────────────────────────────────────────────
  docker-build:
    name: "Docker Build Validation"
    runs-on: ubuntu-latest
    # Only run docker build after both CI jobs pass
    needs: [frontend-ci, backend-ci]

    steps:
      - name: "⬇️ Checkout repository"
        uses: actions/checkout@v4

      - name: "⚙️ Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      # ── Backend Image ─────────────────────────────────────────
      - name: "🐳 Build backend Docker image"
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: jeevan-roshini-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend build stage ──────────────────────────────────
      - name: "🐳 Build frontend Docker image (build stage)"
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: build
          push: false
          tags: jeevan-roshini-frontend:ci-build
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Frontend production stage ─────────────────────────────
      - name: "🐳 Build frontend Docker image (production stage)"
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: false
          tags: jeevan-roshini-frontend:ci-production
          cache-from: type=gha
          cache-to: type=gha,mode=max
