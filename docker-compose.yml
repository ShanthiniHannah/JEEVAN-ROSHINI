version: '3.9'

services:
  # ──────────────────────────────────────
  # MySQL 8 Database
  # ──────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: jeevan-roshini-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      ${DB_DATABASE:-jeevan_roshini}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_USER:          ${DB_USERNAME:-jeevan_user}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-jeevan_pass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────
  # Laravel Backend API
  # ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jeevan-roshini-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV:   ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY:   ${APP_KEY:-base64:dz9eSNeAc40wv/E9iyOqIs52jQnxW5hAWfAPFwJfj00=}
      DB_CONNECTION: mysql
      DB_HOST:       mysql
      DB_PORT:       3306
      DB_DATABASE:   ${DB_DATABASE:-jeevan_roshini}
      # Match MYSQL_USER / MYSQL_PASSWORD above — use root for migrate/seed
      DB_USERNAME:   root
      DB_PASSWORD:   ${DB_PASSWORD:-rootpassword}
      SANCTUM_STATEFUL_DOMAINS: "localhost,localhost:5173,localhost:8000,127.0.0.1"
      SESSION_DRIVER: file
      CACHE_STORE:    file
    ports:
      - "8000:8000"
    volumes:
      # Mount source so you can edit without rebuild in local dev
      - ./backend:/var/www/html
      # Preserve the vendor dir from the image (don't overwrite with host)
      - /var/www/html/vendor
    command: >
      sh -c "php artisan key:generate --force &&
             php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  # ──────────────────────────────────────
  # React Frontend (Vite dev with HMR)
  # ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Use the 'dev' stage which already has npm ci and runs vite dev
      target: dev
    container_name: jeevan-roshini-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Preserve node_modules from the image layer — don't overwrite with host
      - /app/node_modules

volumes:
  mysql_data:
